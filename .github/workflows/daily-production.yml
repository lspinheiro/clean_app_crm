name: Daily Production Release

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Australia/Brisbane"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-production-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.3"
  SUPABASE_CLI_VERSION: "2.114.0"
  VERCEL_CLI_VERSION: "59.1.3"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Check out default-branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject a manual run from a non-default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this production workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome
        run: pnpm --filter crm exec playwright install --with-deps chrome

      - name: Start local Supabase
        run: pnpm db:start

      - name: Run repository checks
        run: pnpm check

      - name: Run acceptance tests
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: pnpm db:stop

      - name: Decide whether this commit needs deployment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            deploy=true
            reason="manual runs always deploy"
          else
            previous_sha="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-production.yml/runs?status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""'
            )"
            if [[ -z "$previous_sha" || "$previous_sha" != "$GITHUB_SHA" ]]; then
              deploy=true
              reason="default-branch commit has not completed this workflow"
            else
              deploy=false
              reason="default-branch commit already completed this workflow"
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "### Release decision" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: **$deploy** — $reason." >> "$GITHUB_STEP_SUMMARY"

  supabase:
    name: Deploy Supabase
    needs: checks
    if: needs.checks.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: internal-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate Supabase configuration
        run: |
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured in the internal-production environment."
              exit 1
            fi
          done

      - name: Link hosted project
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
          --workdir packages/db

      - name: Preview migrations
        run: supabase db push --dry-run --workdir packages/db

      - name: Apply migrations
        run: supabase db push --workdir packages/db

      - name: Verify migration idempotence
        run: supabase db push --dry-run --workdir packages/db

  cleaner:
    name: Deploy Cleaner
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal-production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_CLEANER_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Validate Vercel configuration
        run: |
          for variable in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured for the Cleaner deployment."
              exit 1
            fi
          done

      - name: Pull Cleaner production settings
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Build Cleaner with production settings
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build
          --prod
          --token="$VERCEL_TOKEN"

      - name: Deploy Cleaner
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy
          --prebuilt
          --prod
          --yes
          --token="$VERCEL_TOKEN"

  crm:
    name: Deploy CRM
    needs: cleaner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal-production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_CRM_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Validate Vercel configuration
        run: |
          for variable in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured for the CRM deployment."
              exit 1
            fi
          done

      - name: Pull CRM production settings
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Build CRM with production settings
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build
          --prod
          --token="$VERCEL_TOKEN"

      - name: Deploy CRM
        run: >-
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy
          --prebuilt
          --prod
          --yes
          --token="$VERCEL_TOKEN"

  smoke:
    name: Smoke production domains
    needs: crm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify hosted routes
        run: |
          urls=(
            "https://crm.thecleancrew.app/en-AU/login"
            "https://cleaner.thecleancrew.app/login"
            "https://cleaner.thecleancrew.app/join?code=ABC123"
          )
          for url in "${urls[@]}"; do
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --show-error \
              --silent \
              --output /dev/null \
              "$url"
          done
