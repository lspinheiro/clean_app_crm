project_id = "clean_app_crm"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/en-AU/auth/confirm",
  "http://localhost:3000/pt-BR/auth/confirm",
  "http://127.0.0.1:3000/en-AU/auth/confirm",
  "http://127.0.0.1:3000/pt-BR/auth/confirm",
  "http://127.0.0.1:3001",
  "http://localhost:3001",
]
jwt_expiry = 3600
# CL-1 registers cleaners from the invite link, so the cleaner app needs sign-up.
enable_signup = true

[auth.email.template.invite]
subject = "The Clean Crew company invitation / Convite da empresa"
content_path = "./supabase/templates/invite.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false

[edge_runtime]
enabled = false
